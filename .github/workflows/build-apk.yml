
name: Build BOOMGRATULATIONS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - boom-upgrade-v1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Prepare Android project
        run: |
          cp lib/main.dart /tmp/boom_main.dart
          flutter create . --platforms=android --project-name boomgratulations
          cp /tmp/boom_main.dart lib/main.dart

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permission + "    <application", 1)
          path.write_text(content)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate BOOM Android app icon
        run: dart run flutter_launcher_icons

      - name: Check Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=API_FOOTBALL_KEY="$API_FOOTBALL_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOMGRATULATIONS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
