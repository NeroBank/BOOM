
name: Build BOOMGRATULATIONS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: |
          which flutter
          flutter --version
          flutter doctor -v

      - name: Generate Android platform files
        run: |
          cp lib/main.dart /tmp/boom_main.dart
          flutter create . --platforms=android --project-name boomgratulations
          cp /tmp/boom_main.dart lib/main.dart
          rm -f test/widget_test.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: flutter build apk --release --dart-define=API_FOOTBALL_KEY=${API_FOOTBALL_KEY}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: boomgratulations-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
