
name: Build BOOMGRATULATIONS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Generate Android platform files
        shell: bash
        run: |
          cp lib/main.dart /tmp/boomgratulations_main.dart
          flutter create . --platforms=android --project-name boomgratulations
          cp /tmp/boomgratulations_main.dart lib/main.dart
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter source
        continue-on-error: true
        run: flutter analyze

      - name: Build Android APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=API_FOOTBALL_KEY="${API_FOOTBALL_KEY}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boomgratulations-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
