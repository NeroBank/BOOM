
name: boomgratulations
description: BOOMGRATULATIONS football fixtures, live scores, picks, history and Pro.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/boom_logo.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/Montserrat-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/boom_logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/boom_logo.png
